[phases.setup]
# Chromium system library dependencies for Playwright
aptPkgs = [
  "libx11-6",
  "libxcb1",
  "libxext6",
  "libxi6",
  "libxtst6",
  "libxss1",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libatspi2.0-0"
]

[phases.install]
cmds = [
  "pnpm install --frozen-lockfile",
  "pnpm exec playwright install chromium"
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"
