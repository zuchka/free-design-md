[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# DATABASE_URL is supplied as a Railway secret and points to the private
# Supabase Postgres connection. The legacy /app/data volume is retained only
# through the rollback window and is not used by the running application.
